<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Espanha • Nosso próximo capítulo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <svg class="ic logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 44V20a16 16 0 0 1 32 0v24" />
          <path d="M16 44V22a8 8 0 0 1 16 0v22" />
          <path d="M4 44h40" />
        </svg>
        <span>rumo à<br />Espanha</span>
      </div>
      <nav>
        <button data-page="overview" class="active">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          </svg>
          Visão geral</button
        ><button data-page="tasks">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1" />
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <path d="m9 14 2 2 4-4" />
          </svg>
          Pendências e custos</button
        ><button data-page="income">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="6" rx="7" ry="3" />
            <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" />
            <path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" />
          </svg>
          Entradas de dinheiro</button
        ><button data-page="settings">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
            />
          </svg>
          Ajustes e backup
        </button>
      </nav>
      <div class="sidefoot">
        BRASIL &nbsp; → &nbsp; ESPANHA<br />Uma etapa de cada vez. 🌿<br /><small
          >Planejamento da família Assunção</small
        >
      </div>
    </aside>
    <main>
      <div id="app"></div>
      <div class="foot"><span>🇪🇸 Nosso próximo capítulo começa no planejamento.</span></div>
    </main>
    <dialog id="modal"><form id="form"></form></dialog>
    <div id="toast" role="status"></div>
    <div id="login" class="login">
      <div class="loginbox">
        <div class="brand">rumo<span> à </span>Espanha<span>·</span></div>
        <p class="muted" id="loginmsg">Carregando…</p>
        <button class="btn primary" id="loginbtn" hidden onclick="signIn()">Entrar com Google</button>
        <button class="link" id="switchbtn" hidden onclick="switchAccount()">Entrar com outra conta</button>
      </div>
    </div>
    <script src="js/state.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/views.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/records.js"></script>
    <script src="js/sources.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/exchange-rate.js"></script>
    <script src="js/reorder.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/cloud.js"></script>
  </body>
</html>
